version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: financial_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-financial_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-financial_db}" ]
          interval: 5s
          timeout: 5s
          retries: 5

volumes:
  postgres_data:
  